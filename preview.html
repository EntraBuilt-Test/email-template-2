<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nordic Affairs Media — Interactive Email Preview</title>
  <style>
    :root {
      --bg: #050a14;
      --card-bg: #0c1626;
      --border: #1a2f4c;
      --gold: #d4af37;
      --gold-hover: #e5c158;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* TOP HEADER & CONTROLS */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      z-index: 10;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
    }
    .brand-logo-img {
      height: 28px;
      width: auto;
      border-radius: 4px;
      display: block;
    }
    .badge {
      font-size: 11px;
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 700;
    }
    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .device-btn-group {
      display: flex;
      background: #050a14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }
    .btn-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-toggle.active {
      background: var(--gold);
      color: #081021;
      font-weight: 800;
    }
    .input-field {
      background: #050a14;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border 0.15s ease;
    }
    .input-field:focus {
      border-color: var(--gold);
    }
    .btn-action {
      background: var(--gold);
      color: #081021;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-action:hover {
      background: var(--gold-hover);
    }
    .btn-secondary {
      background: #1a2f4c;
      color: #ffffff;
    }
    .btn-secondary:hover {
      background: #254066;
    }

    /* PREVIEW CONTAINER */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #04070e;
      overflow: auto;
    }
    .frame-wrapper {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px #1a2f4c;
      border-radius: 16px;
      overflow: hidden;
      background: #070e1b;
      display: flex;
      flex-direction: column;
      height: 96%;
    }
    .frame-desktop {
      width: 720px;
    }
    .frame-tablet {
      width: 580px;
    }
    .frame-mobile {
      width: 385px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #070e1b;
    }

    /* TOAST NOTIFICATION */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #d4af37;
      color: #081021;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.35);
      display: none;
      animation: fadeIn 0.2s ease;
      z-index: 100;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- HEADER NAVIGATION & CONTROLS -->
  <header>
    <div class="brand-title">
      <img src="logo.png" alt="Logo" class="brand-logo-img" onerror="this.style.display='none'">
      <span>Nordic Affairs Media</span>
      <span class="badge">Official Template</span>
    </div>

    <!-- DEVICE VIEWPORT TOGGLES -->
    <div class="controls-group">
      <div class="device-btn-group">
        <button class="btn-toggle active" onclick="setDevice('desktop', this)">
          🖥️ Desktop (600px)
        </button>
        <button class="btn-toggle" onclick="setDevice('tablet', this)">
          📱 Tablet
        </button>
        <button class="btn-toggle" onclick="setDevice('mobile', this)">
          📲 Mobile (375px)
        </button>
      </div>

      <!-- TARGET LINK BADGE -->
      <a href="https://nordicaffairsmedia.com/en" target="_blank" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gold); background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.25); padding: 5px 12px; border-radius: 6px;">
        🔗 Redirect Target: <strong>nordicaffairsmedia.com/en</strong>
      </a>
    </div>

    <!-- ACTIONS -->
    <div class="controls-group">
      <button class="btn-action btn-secondary" onclick="copyHTML()">
        📋 Copy HTML
      </button>
      <a href="index.html" download="nordic-affairs-media-template.html" class="btn-action" style="text-decoration: none;">
        ⬇️ Download Template
      </a>
    </div>
  </header>

  <!-- FRAME VIEWPORT CONTAINER -->
  <main>
    <div id="frameWrapper" class="frame-wrapper frame-desktop">
      <iframe id="emailFrame" src="index.html"></iframe>
    </div>
  </main>

  <div id="toast" class="toast">HTML code copied to clipboard!</div>

  <script>
    let rawTemplate = '';

    fetch('index.html')
      .then(res => res.text())
      .then(text => {
        rawTemplate = text;
        updateMergeTags();
      });

    function setDevice(device, el) {
      document.querySelectorAll('.device-btn-group .btn-toggle').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      const wrapper = document.getElementById('frameWrapper');
      wrapper.className = `frame-wrapper frame-${device}`;
    }

    function updateMergeTags() {
      if (!rawTemplate) return;
      const frame = document.getElementById('emailFrame');
      frame.contentWindow.document.open();
      frame.contentWindow.document.write(rawTemplate);
      frame.contentWindow.document.close();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2500);
    }

    function copyHTML() {
      if (!rawTemplate) return;
      navigator.clipboard.writeText(rawTemplate).then(() => {
        showToast('✓ Production HTML copied to clipboard!');
      }).catch(err => {
        showToast('Error copying to clipboard');
      });
    }
  </script>
</body>
</html>
